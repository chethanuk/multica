{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "multica.fullname" . | trunc 47 | trimSuffix "-") | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "-qO-"
        - "http://{{ include \"multica.backendServiceName\" . }}:{{ .Values.backend.service.port }}{{ default \"/health\" .Values.backend.probes.readiness.path }}"
  restartPolicy: Never
{{- end }}
